name: Release

# release-please keeps a release PR open on main, built from the feat: and fix: commits since the
# last release. Merging it bumps version in manifest.json (and package.json), updates CHANGELOG.md,
# tags v<version> and creates the GitHub release. The widget is then built and the two files
# EdgeStation's marketplace reads, manifest.json and widget.zip, are attached to that release.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # A release created with the workflow token starts no other workflow, so the upload runs here.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # manifest.json sits at the root of the zip, next to what it points at.
      - run: zip -r widget.zip manifest.json dist icon.svg
      - run: gh release upload "$TAG" manifest.json widget.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
